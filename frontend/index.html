<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PAPA</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT"
      crossorigin="anonymous"
    />
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1 class="app-title">PAPA: Amazing Python Analytics</h1>

      <div class="card app-card">
        <div class="card-body">
          <!-- FILE INPUT -->
          <div class="mb-3">
            <div class="btn-toolbar justify-content-between">
              <label
                for="fileInput"
                class="form-label d-flex align-items-center"
              >
                Select a JSON file to validate
              </label>
              <a
                href="/docs"
                target="_blank"
                class="btn btn-primary btn-sm mb-2 p-2"
              >
                API Docs
              </a>
            </div>
            <div class="file-row">
              <input
                class="form-control"
                type="file"
                id="fileInput"
                accept=".json"
                aria-describedby="fileHelp"
              />
            </div>
            <div id="fileHelp" class="form-text small-muted">
              Only <code>.json</code> files are supported.
            </div>
          </div>

          <!-- IMC SWITCH -->
          <div class="mb-3">
            <div class="form-check form-switch me-3">
              <input class="form-check-input" type="checkbox" id="imcSwitch" />
              <label class="form-check-label" for="imcSwitch">IMC Switch</label>
            </div>
          </div>

          <!-- SUBMIT & CLEAR BUTTONS -->
          <div class="mb-3">
            <button
              type="button"
              class="btn btn-primary w-100"
              id="submitButton"
            >
              Submit
            </button>
            <!-- <button
                id="clearFile"
                class="btn btn-outline-secondary w-35"
                type="button"
                title="Clear selected file"
              >
                Clear Selection
            </button> -->
          </div>

          <div class="divider"></div>

          <div class="d-flex">
            <h5
              class="mb-2 flex-grow-1"
              style="font-weight: 600; color: #2b3b50"
            >
              Analytics
            </h5>
          </div>

          <div id="responseBox" aria-live="polite">
            Analytics will be displayed here
          </div>
        </div>
      </div>
    </div>

    <script>
      // optional UI helper for showing/clearing file selection
      (function () {
        const fileInput = document.getElementById("fileInput");
        // const clearBtn = document.getElementById("clearFile");
        const responseBox = document.getElementById("responseBox");

        if (fileInput) {
          fileInput.addEventListener("change", () => {
            const file = fileInput.files[0];
            if (file) {
              responseBox.textContent = `Selected file: ${file.name}\n\nClick Submit to validate.`;
            } else {
              responseBox.textContent = "No file selected";
            }
          });
        }

        // if (clearBtn) {
        //   clearBtn.addEventListener("click", () => {
        //     if (fileInput) fileInput.value = "";
        //     responseBox.textContent = "No file selected";
        //   });
        // }
      })();
    </script>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
